name: Update Day/Night Map

on:
  schedule:
    - cron: "*/30 * * * *"   # 毎時5分に実行(UTC基準)
  workflow_dispatch:        # 手動実行もできるようにする

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install cartopy matplotlib numpy pillow requests scipy

      - name: Generate map image
        run: python generate_map.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/map.jpg assets/
          git commit -m "Update day/night map" || echo "No changes to commit"
          git push
